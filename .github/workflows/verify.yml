name: verify

on:
  pull_request:
    branches:
      - main
      - integration
  push:
    branches:
      - 'stretch/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        if: ${{ !cancelled() }}
        run: bun test

      - name: Lint
        if: ${{ !cancelled() }}
        run: bunx eslint .

      - name: Types
        if: ${{ !cancelled() }}
        run: bun run check-types

  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/integration' }}
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Affected
        if: ${{ !cancelled() }}
        run: bun run verify:affected

      - name: References
        if: ${{ !cancelled() }}
        run: bunx tsc --build tsconfig.references.json

      - name: Graph
        if: ${{ !cancelled() }}
        run: bun scripts/workspace/graph-check.ts

  atlas:
    # The publishable Atlas libraries' own gates, one leg per package, from
    # its folder: the root `bun test` skips them (each bunfig preloads a
    # DOM). No visual snapshot step: baselines are per machine and have no
    # durable store yet.
    name: atlas (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - addons/atlas/ui
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Browsers
        run: bunx playwright install --with-deps chromium

      - name: Types
        if: ${{ !cancelled() }}
        run: bun run check-types

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Build Storybook
        if: ${{ !cancelled() }}
        run: bun run build:storybook

      - name: Stories
        if: ${{ !cancelled() }}
        run: bun run check:stories
