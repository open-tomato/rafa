# The rafa release publish workflow: level 2 of the release ladder.
#
# Written into a project's `.github/workflows/` by `writeReleaseWorkflow`
# (`src/release/templates.ts`) for `release.publish: ci`. A pushed tag,
# or a workflow that tags in its own run and calls this one with the tag
# as `ref`, checks the tag out, runs the gates and then
# `rafa release publish`, which publishes every release unit whose tag
# points at the checked-out commit and skips a version the registry
# already holds.
#
# npm trusted publishing needs npm 11.5.1 or newer, `id-token: write` on
# the job, and a trusted publisher configured on npmjs.com for each
# package, naming this repository and this workflow file. npm attaches
# provenance on a trusted publish, so no token and no flag are set here.
#
# A tag pushed with a workflow's GITHUB_TOKEN starts no other workflow
# run, so a workflow that tags calls this one through `workflow_call`
# instead of waiting for the `push` trigger.
#
# rafa runs from the checkout when the project is rafa itself (its
# manifest names `@open-tomato/rafa` and git tracks `src/rafa.ts`), and
# from a global install otherwise, so one file serves both.
name: Release publish

on:
  push:
    tags: ['**']
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to publish from.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        if: ${{ !cancelled() }}
        run: bun test

      - name: Lint
        if: ${{ !cancelled() }}
        run: bunx eslint .

      - name: Types
        if: ${{ !cancelled() }}
        run: bun run check-types

      - name: Publish
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          if [ "$name" = '@open-tomato/rafa' ] && git ls-files --error-unmatch src/rafa.ts > /dev/null 2>&1; then
            bun src/rafa.ts release publish
          else
            bun install -g @open-tomato/rafa
            export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
            rafa release publish
          fi
