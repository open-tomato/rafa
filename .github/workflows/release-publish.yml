# The rafa release publish workflow: level 2 of the release ladder.
#
# Written into a project's `.github/workflows/` by `writeReleaseWorkflow`
# (`packages/rafa-release/src/release/templates.ts`) for
# `release.publish: ci`. A pushed tag, or a workflow that tags in its own
# run and calls this one with the tag as `ref`, checks the tag out, runs
# the gates and then `rafa release publish`, which publishes every
# release unit whose tag points at the checked-out commit and skips a
# version the registry already holds.
#
# npm trusted publishing needs npm 11.5.1 or newer, `id-token: write` on
# the job, and a trusted publisher configured on npmjs.com for each
# package, naming this repository and this workflow file. npm attaches
# provenance on a trusted publish, so no token and no flag are set here.
#
# The publish job runs only when the repository variable
# `RAFA_RELEASE_PUBLISH` is `ci`: with it unset or holding anything else,
# GitHub skips the job, and a skipped job does not fail the run. Set it
# under Settings, Secrets and variables, Actions, Variables, or with
# `gh variable set RAFA_RELEASE_PUBLISH --body ci`.
#
# A tag pushed with a workflow's GITHUB_TOKEN starts no other workflow
# run, so a workflow that tags calls this one through `workflow_call`
# instead of waiting for the `push` trigger.
#
# rafa needs a config with `release.enabled: true`, and the checkout may
# hold none: when none of `rafa.config.ts`, `rafa.config.mjs` and
# `.rafa/config.yaml` is there, the workflow writes `.rafa/config.yaml`
# with that key. A committed config is left as it is, so a project that
# needs other release keys in CI commits them.
#
# rafa runs from the checkout when the project is rafa itself (its
# manifest names `@open-tomato/rafa` and git tracks `src/rafa.ts`), and
# from a global install otherwise, so one file serves both.
name: Release publish

on:
  push:
    tags: ['**']
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to publish from.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.RAFA_RELEASE_PUBLISH == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        if: ${{ !cancelled() }}
        run: bun test

      - name: Lint
        if: ${{ !cancelled() }}
        run: bunx eslint .

      - name: Types
        if: ${{ !cancelled() }}
        run: bun run check-types

      - name: Write the CI config
        shell: bash
        run: |
          if [ ! -f rafa.config.ts ] && [ ! -f rafa.config.mjs ] && [ ! -f .rafa/config.yaml ]; then
            mkdir -p .rafa
            printf '%s\n' '# Written by the Release publish workflow: the checkout holds no rafa config.' 'release:' '  enabled: true' > .rafa/config.yaml
          fi

      - name: Publish
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          if [ "$name" = '@open-tomato/rafa' ] && git ls-files --error-unmatch src/rafa.ts > /dev/null 2>&1; then
            bun src/rafa.ts release publish
          else
            bun install -g @open-tomato/rafa
            export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
            rafa release publish
          fi
