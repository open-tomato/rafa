# Dependabot version updates for this repository. The lockfile is bun.lock,
# which the npm ecosystem does not update, so the package ecosystem is bun.
# src/tests/dependabot-config.test.ts checks this file against the keys and
# values the Dependabot configuration docs name.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
